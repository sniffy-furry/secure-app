name: Android Build (Java)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sanity-check gradle.properties is present
        run: |
          if [ ! -f gradle.properties ]; then
            echo "::error::gradle.properties is missing from the repo root."
            exit 1
          fi
          cat gradle.properties

      - name: Paste-in check for the BIP-39 wordlist
        run: |
          COUNT=$(grep -o '"[a-z]*"' app/src/main/java/com/nulchat/identity/Wordlist.java | wc -l)
          echo "Wordlist currently has $COUNT entries (needs 2048)."
          if [ "$COUNT" -lt 2048 ]; then
            echo "::warning::Wordlist.java does not yet contain the full 2048-word BIP-39 list — the app will crash on launch until it does. See README.md."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: >
          gradle assembleDebug --stacktrace
          -Pandroid.useAndroidX=true
          -Pandroid.nonTransitiveRClass=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nulchat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
