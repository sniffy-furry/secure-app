apply plugin: 'com.android.application'

android {
    namespace 'com.nulchat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nulchat'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-java'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Plain Android Views + Material Components — no Compose, no Kotlin.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'

    // Crypto primitives (Apache 2.0 — no AGPL issue, unlike libsignal).
    // If the exact version below is gone from Maven Central by the time you
    // build, bump it — the API used here (X25519 / Hkdf / Ed25519Sign /
    // ChaCha20Poly1305, all in com.google.crypto.tink.subtle) has been
    // stable across many releases.
    implementation 'com.google.crypto.tink:tink-android:1.15.0'

    // Encrypted local storage.
    implementation 'net.zetetic:android-database-sqlcipher:4.5.6'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
