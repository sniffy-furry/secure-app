apply plugin: 'com.android.application'

android {
    namespace 'com.mulechat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mulechat.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1-shell"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// One of the newer dependencies below (Tink or security-crypto) pulls in
// androidx.annotation:annotation-jvm, which duplicates classes already
// provided by the older androidx.annotation:annotation that appcompat/
// material pull in. Both artifacts ship the same classes under the same
// package, so excluding the old one everywhere is safe -- annotation-jvm
// is the newer split-artifact replacement, not a different API.
configurations.all {
    exclude group: 'androidx.annotation', module: 'annotation'
}

dependencies {
    implementation project(':core')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Encrypted local storage.
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Periodic backup (BackupWorker/BackupScheduler): WorkManager for the
    // schedule, DocumentFile for reading/writing inside the SAF folder tree
    // the user picks in Settings.
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
