apply plugin: 'com.android.application'

android {
    namespace 'com.mulechat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mulechat.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1-shell"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Crypto primitives (Apache 2.0 -- no AGPL issue, unlike libsignal).
    // API used (X25519 / Hkdf / Ed25519Sign / ChaCha20Poly1305, all in
    // com.google.crypto.tink.subtle) has been stable across many releases.
    // If this exact version is gone from Maven Central, bump it.
    implementation 'com.google.crypto.tink:tink-android:1.15.0'

    // Encrypted local storage.
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
